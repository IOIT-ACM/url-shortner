name: Deploy Links App to cPanel

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Go Binary
        run: |
          CGO_ENABLED=0 GOOS=linux go build -a -o links-server .
          chmod +x links-server

      - name: Build frontend
        run: bun install && bun run build
        working-directory: ./frontend

      - name: Check SSH Connectivity
        id: check_ssh
        shell: bash
        run: |
          # Use timeout and bash tcp check to see if the port is open
          if timeout 5s bash -c 'cat < /dev/tcp/${{ secrets.SSH_HOST }}/${{ secrets.SSH_PORT }}' > /dev/null 2>&1; then
            echo "ssh_up=true" >> $GITHUB_OUTPUT
            echo "Successfully connected to SSH host."
          else
            echo "ssh_up=false" >> $GITHUB_OUTPUT
            echo "::warning title=Deployment Skipped::SSH Host ${{ secrets.SSH_HOST }} is unreachable. Exiting deployment safely."
          fi
        continue-on-error: true

      - name: Pre-Upload Cleanup (Stop App & Prep Dirs)
        if: steps.check_ssh.outputs.ssh_up == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            pkill -f links-server || true
            mkdir -p ~/links.ioit.acm.org/frontend
            sleep 2

      - name: Upload Binary and Scripts
        if: steps.check_ssh.outputs.ssh_up == 'true'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "links-server,restart.sh"
          target: "~/links.ioit.acm.org/"

      - name: Upload Templates (Checked Path)
        if: steps.check_ssh.outputs.ssh_up == 'true'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "templates"
          target: "~/links.ioit.acm.org/"

      - name: Upload Frontend Assets (Checked Path)
        if: steps.check_ssh.outputs.ssh_up == 'true'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend/dist"
          target: "~/links.ioit.acm.org/frontend/"

      - name: Set Permissions and Restart
        if: steps.check_ssh.outputs.ssh_up == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/links.ioit.acm.org/
            chmod +x links-server
            if [ -f restart.sh ]; then
              chmod +x restart.sh
              bash restart.sh
            else
              nohup ./links-server > output.log 2>&1 &
            fi