<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opening Link...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #ededed;
        font-family: "JetBrains Mono", monospace;
        color: #000;
        box-sizing: border-box;
      }
      .container {
        min-height: 100vh;
        padding: 64px 72px;
        position: relative;
        box-sizing: border-box;
      }
      h1 {
        font-size: clamp(36px, 6vw, 72px);
        font-weight: 400;
        margin: 0 0 24px 0;
        letter-spacing: -0.02em;
      }
      .help-text {
        max-width: 720px;
        font-size: clamp(16px, 1.8vw, 20px);
        line-height: 1.6;
        margin-bottom: 48px;
        color: #111;
      }
      .open-button {
        display: inline-block;
        margin-bottom: 16px;
        margin-right: 16px;
        font-size: 16px;
        color: #000;
        text-decoration: underline;
        cursor: pointer;
      }
      .copy-button {
        display: inline-block;
        margin-bottom: 16px;
        font-size: 16px;
        color: #000;
        text-decoration: underline;
        background: none;
        border: none;
        cursor: pointer;
        font-family: "JetBrains Mono", monospace;
        padding: 0;
      }
      .arrow {
        position: absolute;
        right: 32px;
        bottom: 16px;
        font-size: clamp(140px, 28vw, 420px);
        font-weight: 900;
        line-height: 0.85;
        opacity: 0.15;
      }
    </style>
  </head>
  <body data-url="{{.OriginalURL}}">
    <div class="container">
      <h1 id="title">Opening link...</h1>
      <p id="help" class="help-text">
        If the link does not open automatically, use the button below or copy
        the link to open in your browser.
      </p>
      {{ if .OriginalURL }}
      <a
        id="openBtn"
        href="{{.OriginalURL}}"
        target="_blank"
        rel="noopener noreferrer"
        class="open-button"
        >Open Link</a
      >
      <button id="copyBtn" class="copy-button">Copy Link</button>
      {{end}}
      <div class="arrow">→</div>
    </div>
    <script>
      function uaLower() {
        return (navigator.userAgent || "").toLowerCase();
      }
      function isAndroid() {
        return /android/.test(uaLower());
      }
      function isIOS() {
        return /iphone|ipad|ipod/.test(uaLower());
      }
      function isInstagram() {
        var u = uaLower();
        return (
          u.indexOf("instagram") !== -1 || u.indexOf("instagram for") !== -1
        );
      }
      function isFacebookInApp() {
        var u = uaLower();
        return (
          u.indexOf("fbav") !== -1 ||
          u.indexOf("fban") !== -1 ||
          u.indexOf("facebook") !== -1
        );
      }
      function tryClipboardWrite(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        try {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          var ok = document.execCommand("copy");
          document.body.removeChild(ta);
          return ok ? Promise.resolve() : Promise.reject();
        } catch (e) {
          return Promise.reject(e);
        }
      }
      function buildIntentUrl(original) {
        try {
          var u = new URL(original);
          var noProto = original.replace(/^https?:\/\//, "");
          var intent =
            "intent://" +
            noProto +
            "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" +
            encodeURIComponent(original) +
            ";end";
          return intent;
        } catch (e) {
          return original;
        }
      }
      function openExternal(original) {
        if (isAndroid()) {
          var intentUrl = buildIntentUrl(original);
          window.location.replace(intentUrl);
        } else {
          window.open(original, "_blank", "noopener");
        }
      }
      function proceedAuto(original) {
        if (!isInstagram() && !isFacebookInApp()) {
          setTimeout(function () {
            window.location.replace(original);
          }, 600);
          return;
        }
        if (isInstagram() || isFacebookInApp()) {
          if (isAndroid()) {
            openExternal(original);
            return;
          } else {
            document.getElementById("title").textContent =
              "Open in your browser";
            document.getElementById("help").textContent =
              "Instagram/iOS often opens links inside the app. Tap Open Link to open in your browser.";
            document
              .getElementById("openBtn")
              .addEventListener("click", function (e) {
                e.preventDefault();
                openExternal(original);
              });
            return;
          }
        }
        setTimeout(function () {
          window.location.replace(original);
        }, 600);
      }
      var original = document.body.getAttribute("data-url") || location.href;
      var openBtn = document.getElementById("openBtn");
      var copyBtn = document.getElementById("copyBtn");
      openBtn.setAttribute("href", original);
      openBtn.addEventListener("click", function (e) {
        e.preventDefault();
        openExternal(original);
      });
      copyBtn.addEventListener("click", function () {
        tryClipboardWrite(original)
          .then(function () {
            alert("Link copied to clipboard");
          })
          .catch(function () {
            var el = document.createElement("input");
            el.value = original;
            document.body.appendChild(el);
            el.select();
            try {
              document.execCommand("copy");
              alert("Link copied to clipboard");
            } catch (e) {
              alert("Copy failed. Long-press the link to copy.");
            }
            document.body.removeChild(el);
          });
      });
      proceedAuto(original);
    </script>
  </body>
</html>
